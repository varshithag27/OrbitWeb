{% extends "base.html" %}
{% block title %}Create account · Orbit{% endblock %}
{% block content %}
<div class="auth-shell">
  {% include "_hero.html" %}

  <div class="auth-form-panel">
    <div class="auth-card">
      <h2>Create your account</h2>

      <form method="POST" action="{{ url_for('register') }}">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name"  required autofocus>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="phone">Phone number <span style="font-weight:400;color:var(--text-secondary);"></span></label>
          <input type="tel" id="phone" name="phone" >
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p class="switch-line">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
