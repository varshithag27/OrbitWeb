<div class="auth-hero">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="13" stroke="#fff" stroke-width="2" opacity="0.35"/>
      <circle cx="15" cy="6" r="3" fill="#fff"/>
      <circle cx="24" cy="20" r="3" fill="#fff"/>
      <circle cx="6" cy="20" r="3" fill="#fff"/>
    </svg>
    Orbit
  </div>

  <div class="hero-copy">
    <h1>{{ hero_title | default("Make Your circle, verified.") }}</h1>
    <p>{{ hero_text | default("Because apparently “trust me bro” isn't a security system.") }}</p>
  </div>

  <div class="hero-foot">&copy; 2026 Orbit. A demo authentication experience.</div>

  <svg class="constellation" viewBox="0 0 520 520" preserveAspectRatio="xMidYMid slice">
    <g class="ring" opacity="0.5">
      <circle cx="260" cy="260" r="190" stroke="#ffffff" stroke-opacity="0.08" fill="none"/>
    </g>
    <line class="link" x1="120" y1="140" x2="260" y2="90" stroke="#8fa4ff" stroke-width="1.2"/>
    <line class="link" x1="260" y1="90" x2="400" y2="150" stroke="#8fa4ff" stroke-width="1.2"/>
    <line class="link" x1="400" y1="150" x2="420" y2="320" stroke="#8fa4ff" stroke-width="1.2"/>
    <line class="link" x1="420" y1="320" x2="280" y2="420" stroke="#8fa4ff" stroke-width="1.2"/>
    <line class="link" x1="280" y1="420" x2="110" y2="360" stroke="#8fa4ff" stroke-width="1.2"/>
    <line class="link" x1="110" y1="360" x2="120" y2="140" stroke="#8fa4ff" stroke-width="1.2"/>
    <line class="link" x1="120" y1="140" x2="280" y2="420" stroke="#8fa4ff" stroke-width="0.8"/>

    <circle class="node n1" cx="120" cy="140" r="5" fill="#fff"/>
    <circle class="node n2" cx="260" cy="90" r="5" fill="#fff"/>
    <circle class="node n3" cx="400" cy="150" r="5" fill="#fff"/>
    <circle class="node n4" cx="420" cy="320" r="5" fill="#fff"/>
    <circle class="node n5" cx="280" cy="420" r="5" fill="#fff"/>
    <circle class="node n1" cx="110" cy="360" r="5" fill="#fff"/>
  </svg>
</div>
